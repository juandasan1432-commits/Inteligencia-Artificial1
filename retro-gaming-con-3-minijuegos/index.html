<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RETRO GAMING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Silkscreen&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#090914;--surface:#171725;--surface-2:#1f1f33;--purple:#7928CA;--blue:#287BFF;--violet:#A855F7;--white:#FFFFFF;
  --text:#ECEBFA;--muted:#A6A5C4;--line:rgba(168,85,247,.22);--danger:#FF5C7A;--ok:#3DDC97;--star:#FFC94D;
  --display:Audiowide,'Arial Black',Arial,sans-serif;--pixel:Silkscreen,'Courier New',monospace;--body:Rubik,'Segoe UI',Arial,sans-serif;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090914;--surface:#171725}}
:root[data-theme="dark"]{--bg:#090914;--surface:#171725}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(9,9,20,.92)}
img{max-width:100%;display:block}
a{color:var(--violet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* zona arcade: estilos aislados para conservar el resto del sitio */
.arcade-page{padding-top:40px}
.arcade-game-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:0 16px 50px rgba(0,0,0,.24)}
.arcade-game-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.arcade-game-top h2{font:700 clamp(19px,3vw,29px) var(--display);color:var(--white);margin:10px 0}
.arcade-game-top p{color:var(--muted);margin:0}
.arcade-chip{display:inline-block;padding:5px 10px;border:1px solid var(--violet);border-radius:100px;color:var(--violet);font:12px var(--pixel)}
.arcade-frame{display:block;width:100%;height:clamp(390px,70vw,650px);border:2px solid var(--purple);border-radius:var(--r-md);background:#0d0f18}
.arcade-tip{margin:14px 0 0;color:var(--muted);font-size:13px}
.arcade-footnote{text-align:center;color:var(--muted);padding:24px 0}
.arcade-teaser{display:flex;align-items:center;gap:22px;background:linear-gradient(115deg,rgba(121,40,202,.22),rgba(40,123,255,.12));border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;text-decoration:none;color:var(--text);transition:border-color .2s,transform .2s}
.arcade-teaser:hover{border-color:var(--violet);transform:translateY(-3px)}
.arcade-teaser-art{width:84px;min-width:84px;height:84px;display:grid;place-items:center;background:rgba(40,123,255,.18);border-radius:16px;color:#70d0ff;font-size:48px}
.arcade-teaser strong{display:block;color:var(--white);font:700 20px var(--display)}
.arcade-teaser small{display:block;color:var(--muted);margin-top:6px;font-size:13px}
.arcade-teaser-cta{margin-left:auto;white-space:nowrap;color:var(--violet);font-weight:700}
@media(max-width:620px){.arcade-teaser{flex-wrap:wrap;gap:12px}.arcade-teaser-art{width:62px;min-width:62px;height:62px;font-size:34px}.arcade-teaser strong{font-size:15px}.arcade-teaser-cta{margin-left:0;width:100%;text-align:right}.arcade-game-panel{padding:10px}.arcade-frame{height:420px}}


/* Selector de los tres juegos, integrado al diseño retro existente */
.arcade-library{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0 22px}
.arcade-choice{font:inherit;text-align:left;cursor:pointer;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;transition:border-color .2s,transform .2s,background .2s}
.arcade-choice:hover{border-color:var(--violet);transform:translateY(-2px)}
.arcade-choice[aria-pressed="true"]{border:2px solid var(--violet);background:linear-gradient(125deg,rgba(121,40,202,.22),rgba(40,123,255,.08))}
.arcade-choice-icon{display:block;font-size:31px;margin-bottom:10px}
.arcade-choice-name{display:block;color:var(--white);font:700 16px var(--display);margin-bottom:8px}
.arcade-choice-desc{display:block;color:var(--muted);font-size:12px;line-height:1.6}
.arcade-frame{min-height:550px}
@media(max-width:760px){.arcade-library{grid-template-columns:1fr}.arcade-choice{padding:14px}.arcade-frame{height:550px}}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(9,9,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--white);font-family:var(--display);font-size:20px;white-space:nowrap}
.logo b{font-weight:400;background:linear-gradient(90deg,var(--violet),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(168,85,247,.55))}
.nav{display:flex;gap:4px}
.nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:var(--r-sm);font-weight:500;font-size:15px}
.nav a:hover{color:var(--white);background:var(--surface)}
.nav a[aria-current="page"]{color:var(--white);background:linear-gradient(90deg,rgba(121,40,202,.45),rgba(40,123,255,.3))}
.hsearch{flex:1;max-width:300px;margin-left:auto;position:relative}
.hsearch input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 38px}
.hsearch svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.7}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;text-decoration:none;color:var(--text);white-space:nowrap;font-size:14px}
.me-chip .av{width:30px;height:30px;font-size:17px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:var(--r-sm);width:42px;height:42px;cursor:pointer}
@media (max-width:980px){
  .nav{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px 16px}
  .nav.open{display:flex}
  .menu-btn{display:block}
  .hsearch{max-width:none}
}
@media (max-width:560px){.logo .g{display:none}.me-chip .nm{display:none}.me-chip{padding:4px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.6px;cursor:pointer;text-decoration:none;color:var(--white);background:linear-gradient(90deg,var(--purple),var(--blue));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 28px rgba(121,40,202,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 34px rgba(40,123,255,.45)}
.btn.ghost{background:transparent;border:1px solid var(--violet);box-shadow:none}
.btn.ghost:hover{background:rgba(168,85,247,.12)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.danger{background:var(--danger);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link-btn{background:none;border:0;color:var(--violet);cursor:pointer;padding:4px 6px;font-size:14px;border-radius:6px}
.link-btn:hover{background:rgba(168,85,247,.12)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:500}
.icon-btn[aria-pressed="true"]{border-color:var(--danger);color:#ffd4dc;background:rgba(255,92,122,.12)}

/* hero: synthwave scene */
.hero{position:relative;overflow:hidden;min-height:clamp(520px,78vh,720px);display:flex;align-items:center;border-bottom:1px solid var(--line);isolation:isolate}
.scene{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#07071a 0%,#1a0b38 38%,#3b0f63 52%,#090914 52.2%)}
.stars-bg{position:absolute;inset:0 0 50% 0;background-image:radial-gradient(1px 1px at 12% 22%,#fff8,transparent),radial-gradient(1px 1px at 32% 12%,#fff6,transparent),radial-gradient(1.5px 1.5px at 48% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 8%,#fff7,transparent),radial-gradient(1px 1px at 86% 26%,#fff6,transparent),radial-gradient(1.5px 1.5px at 92% 14%,#fff9,transparent),radial-gradient(1px 1px at 22% 40%,#fff5,transparent),radial-gradient(1px 1px at 58% 18%,#fff6,transparent);animation:twinkle 4s ease-in-out infinite alternate}
.sun{position:absolute;left:60%;bottom:46%;width:clamp(170px,22vw,320px);aspect-ratio:1;border-radius:50%;
  background:linear-gradient(180deg,#f9a8ff 0%,#d946ef 30%,#A855F7 55%,#7928CA 80%);
  -webkit-mask-image:linear-gradient(#000 0 55%,transparent 55%),repeating-linear-gradient(180deg,#000 0 13px,transparent 13px 19px);
  mask-image:linear-gradient(#000 0 55%,transparent 55%),repeating-linear-gradient(180deg,#000 0 13px,transparent 13px 19px);
  filter:drop-shadow(0 0 50px rgba(217,70,239,.75));animation:sunrise 1.6s cubic-bezier(.2,.8,.2,1) both,pulse 5s ease-in-out 1.6s infinite}
.mtn{position:absolute;left:0;right:0;bottom:47.8%;width:100%;height:18%}
.floor{position:absolute;left:-60%;right:-60%;top:52%;height:110%;transform-origin:50% 0;transform:perspective(320px) rotateX(70deg);
  background-image:linear-gradient(rgba(168,85,247,.85) 2px,transparent 2px),linear-gradient(90deg,rgba(40,123,255,.7) 2px,transparent 2px);background-size:70px 70px;
  -webkit-mask-image:linear-gradient(transparent,#000 12%,#000 60%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 60%,transparent);animation:grid 1.2s linear infinite}
.scene::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(5,5,14,.85)),linear-gradient(90deg,rgba(9,9,20,.92) 0%,rgba(9,9,20,.55) 40%,transparent 70%)}
@keyframes grid{to{background-position:0 70px}}
@keyframes twinkle{to{opacity:.45}}
@keyframes sunrise{from{transform:translateY(40%);opacity:0}}
@keyframes pulse{50%{filter:drop-shadow(0 0 75px rgba(217,70,239,.95))}}
.hero-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:72px 20px;width:100%}
.eyebrow{font-family:var(--pixel);color:var(--blue);font-size:15px;letter-spacing:1px;margin:0 0 16px;text-shadow:0 0 12px rgba(40,123,255,.7)}
.eyebrow::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,7vw,92px);line-height:1;margin:0 0 22px;color:var(--white);text-shadow:0 0 30px rgba(121,40,202,.55)}
.hero h1 .hl{background:linear-gradient(90deg,var(--purple),var(--violet) 45%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(168,85,247,.55))}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);color:#d6d3f0;max-width:520px;margin:0 0 32px}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.deck{position:relative;height:380px}
.deck a{position:absolute;left:50%;top:50%;width:200px;margin:-150px 0 0 -100px;border-radius:14px;overflow:hidden;border:1px solid rgba(168,85,247,.5);box-shadow:0 24px 60px rgba(0,0,0,.65);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .7s;text-decoration:none}
.deck a[data-pos="0"]{transform:translateZ(0) rotate(-2deg);z-index:3;box-shadow:0 0 0 1px rgba(168,85,247,.7),0 0 50px rgba(168,85,247,.45),0 24px 60px rgba(0,0,0,.65)}
.deck a[data-pos="1"]{transform:translate(110px,-14px) rotate(9deg) scale(.86);z-index:2;filter:brightness(.6)}
.deck a[data-pos="2"]{transform:translate(-110px,-14px) rotate(-11deg) scale(.86);z-index:2;filter:brightness(.6)}
.deck a[data-pos="h"]{transform:translateY(40px) scale(.7);opacity:0;z-index:1;pointer-events:none}
.deck .cv{aspect-ratio:3/4}
.deck .cv img,.deck .cv svg{width:100%;height:100%;object-fit:cover}
.deck-cap{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-family:var(--pixel);font-size:13px;color:var(--muted)}
@media (max-width:860px){.hero-in{grid-template-columns:1fr;padding:48px 20px 40px}.deck{height:300px}.deck a{width:150px;margin:-112px 0 0 -75px}.deck a[data-pos="1"]{transform:translate(80px,-10px) rotate(9deg) scale(.84)}.deck a[data-pos="2"]{transform:translate(-80px,-10px) rotate(-11deg) scale(.84)}.sun{left:50%;width:150px;opacity:.55}.scene::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(9,9,20,.9) 0%,rgba(9,9,20,.75) 50%,rgba(9,9,20,.2) 75%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* sections */
main{min-height:60vh}
.sec{padding:44px 0 8px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--white)}
.sec-tools{display:flex;gap:8px;align-items:center}
.rail-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:border-color .15s,background .15s}
.rail-btn:hover{border-color:var(--violet);background:rgba(168,85,247,.15)}
.see-all{color:var(--violet);text-decoration:none;font-size:14px;margin-right:6px}
.see-all:hover{text-decoration:underline}
.sec-h p{margin:4px 0 0;color:var(--muted);font-size:15px}
h1.page{font-family:var(--display);font-size:clamp(34px,5vw,52px);margin:36px 0 6px;color:var(--white);line-height:1.05}
.page-sub{color:var(--muted);margin:0 0 24px;max-width:640px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,200px);gap:18px;overflow-x:auto;padding:10px 4px 20px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#2c2c48 transparent}
.rail>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}

/* game card */
.card{display:block;text-decoration:none;color:var(--text);position:relative;perspective:700px}
.card .frame{position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid rgba(168,85,247,.28);background:#10101d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .25s ease-out,border-color .2s,box-shadow .2s}
.card:hover .frame,.card:focus-visible .frame{border-color:rgba(168,85,247,.85);box-shadow:0 0 0 1px rgba(168,85,247,.4),0 14px 40px rgba(121,40,202,.45),0 0 30px rgba(40,123,255,.25)}
.card .cv{aspect-ratio:3/4;position:relative;background:var(--surface-2)}
.card .cv>img{width:100%;height:100%;object-fit:cover;display:block}
.card .cv>svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),linear-gradient(180deg,transparent 45%,rgba(9,9,20,.35));pointer-events:none}
.ph{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,var(--a) 0%,transparent 75%),linear-gradient(180deg,var(--b) -30%,#0c0c19 90%)}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
.ph svg{position:absolute;left:50%;top:36%;width:46%;transform:translate(-50%,-50%);opacity:.22}
.tagbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:6px 10px;font-family:var(--pixel);font-size:11px;color:#d9d7f2;background:rgba(9,9,20,.55);border-bottom:1px solid rgba(168,85,247,.25);z-index:2}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(transparent,rgba(9,9,20,.92) 55%);z-index:2}
.cap small{display:block;font-family:var(--pixel);font-size:11px;color:#bdb9e0;letter-spacing:.5px;text-transform:uppercase}
.cap b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.2;color:var(--white);margin-top:3px}
.glare{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.18),transparent 45%);opacity:0;transition:opacity .2s}
.card:hover .glare{opacity:1}
.sweep{position:absolute;left:0;right:0;top:-30%;height:30%;z-index:3;pointer-events:none;background:linear-gradient(transparent,rgba(168,85,247,.25),transparent);opacity:0}
.card:hover .sweep{animation:sweep 1.1s linear;opacity:1}
@keyframes sweep{to{top:110%}}
.card .meta{display:flex;justify-content:space-between;gap:8px;padding:8px 2px 0;font-size:13px;color:var(--muted)}
.card .meta .dev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta .rt{color:var(--violet);white-space:nowrap;font-weight:500}
.card .rank{position:absolute;top:30px;left:8px;z-index:4;background:rgba(9,9,20,.85);border:1px solid var(--violet);border-radius:8px;padding:2px 8px;font-family:var(--display);font-size:14px}
.first .card{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(22px)}}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:#4a4966}

/* skeleton & empty */
.sk{border-radius:var(--r-md);min-height:240px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.3s infinite;aspect-ratio:3/4.6}
@keyframes sh{to{background-position:-200% 0}}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:34px 24px;text-align:center;color:var(--muted);background:rgba(23,23,37,.5)}
.empty b{display:block;color:var(--white);font-family:var(--display);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.notice{border-radius:var(--r-md);padding:14px 18px;background:rgba(40,123,255,.1);border:1px solid rgba(40,123,255,.35);color:#cfe0ff;font-size:15px}
.notice.err{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.4);color:#ffd4dc}

/* museum */
.museum{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.museum>div{padding:24px 22px;border-left:1px solid var(--line)}
.museum>div:first-child{border-left:0}
.museum .yr{font-family:var(--display);font-weight:700;font-size:34px;color:var(--white);line-height:1}
.museum p{margin:8px 0 0;color:var(--muted);font-size:15px}
@media (max-width:860px){.museum{grid-template-columns:1fr 1fr}.museum>div:nth-child(3){border-left:0}.museum>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* genres */
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gtile{position:relative;overflow:hidden;border-radius:var(--r-md);padding:20px 18px;min-height:100px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .15s}
.gtile:hover{border-color:var(--violet)}
.gtile .gn{font-family:var(--display);font-weight:700;font-size:20px;color:var(--white)}
.gtile .gc{color:var(--muted);font-size:14px}
.gtile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:var(--g,linear-gradient(135deg,#7928CA,#287BFF));opacity:.35;filter:blur(2px)}

/* ad */
.ad{display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:var(--r-md);padding:16px 20px;background:var(--surface);border:1px solid var(--line);margin:34px 0 0;flex-wrap:wrap}
.ad small{display:block;color:var(--muted);font-size:12px}
.ad b{color:var(--white)}

/* explore */
.explore{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-size:13px;color:var(--muted);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
textarea.inp{resize:vertical;min-height:90px}
.inp:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px rgba(168,85,247,.25)}
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--muted);font-size:15px;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(168,85,247,.15);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--text);cursor:pointer}
.pager{display:flex;gap:8px;justify-content:center;margin:26px 0 0;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pager button[aria-current="page"]{background:linear-gradient(90deg,var(--purple),var(--blue));border-color:transparent}
@media (max-width:860px){.explore{grid-template-columns:1fr}.filters{position:static}}

/* detail */
.detail{display:grid;grid-template-columns:300px 1fr;gap:40px;margin-top:34px}
.detail .cover{border-radius:var(--r-lg);overflow:hidden;box-shadow:0 20px 50px rgba(121,40,202,.35);aspect-ratio:3/4}
.detail .cover img,.detail .cover svg{width:100%;height:100%;object-fit:cover}
.detail h1{font-family:var(--display);font-size:clamp(34px,4.6vw,54px);line-height:1.02;margin:0 0 10px;color:var(--white)}
.facts{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin:22px 0;background:var(--surface)}
.facts div{flex:1 1 170px;padding:12px 14px;box-shadow:0 0 0 .5px var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;color:var(--white);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.desc{font-size:17px;color:#d8d7ee;max-width:68ch}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.shots img{border-radius:var(--r-sm);aspect-ratio:4/3;object-fit:cover;width:100%;cursor:zoom-in}
@media (max-width:760px){.detail{grid-template-columns:1fr}.detail .cover{max-width:260px}}

/* community */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.post{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post .body{flex:1;min-width:0}
.post .who{font-weight:600;color:var(--white);font-size:15px}
.post .when{color:var(--muted);font-size:13px;margin-left:6px;font-weight:400}
.post .txt{margin:4px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.post .on{font-size:13px;color:var(--muted)}
.post .on a{color:var(--violet)}
.replies{margin-left:44px;border-left:2px solid var(--line);padding-left:14px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,var(--purple),var(--blue));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:#4a4966;padding:2px}
.starpick button.on{color:var(--star)}
.form-row{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap}
.counter{color:var(--muted);font-size:13px;margin-right:auto}

/* profile */
.prof{display:flex;gap:20px;align-items:center;margin:34px 0 10px;flex-wrap:wrap}
.prof .av{width:84px;height:84px;font-size:44px}
.avpick{display:flex;gap:8px;flex-wrap:wrap}
.avpick button{width:46px;height:46px;border-radius:50%;border:2px solid transparent;background:var(--surface-2);font-size:24px;cursor:pointer}
.avpick button[aria-pressed="true"]{border-color:var(--violet);box-shadow:0 0 14px rgba(168,85,247,.6)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:24px 0 20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--white);border-bottom-color:var(--violet)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .mini{width:44px;flex:none;border-radius:6px;overflow:hidden;aspect-ratio:3/4}
.row .mini svg,.row .mini img{width:100%;height:100%;object-fit:cover}
.row .grow{flex:1;min-width:0}
.row .grow a{color:var(--white);text-decoration:none;font-weight:600}
.row .sub{color:var(--muted);font-size:13px}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{color:var(--muted);font-weight:500;font-size:13px}
.tbl a{text-decoration:none}
.tbl a:hover{text-decoration:underline}
.tbl-wrap{overflow-x:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.stat .n{font-family:var(--display);font-weight:700;font-size:34px;color:var(--white);line-height:1.1}
.stat .l{color:var(--muted);font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;background:rgba(40,123,255,.18);color:#cfe0ff}
.badge.red{background:rgba(255,92,122,.18);color:#ffd4dc}
.badge.green{background:rgba(61,220,151,.16);color:#c9f7e2}

/* ai */
.ai{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.ai form{display:flex;gap:10px;flex-wrap:wrap}
.ai form .inp{flex:1;min-width:200px}
.ai-res{display:flex;flex-direction:column;gap:12px}
.ai-item{display:flex;gap:14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;text-decoration:none;color:var(--text)}
.ai-item:hover{border-color:var(--violet)}
.ai-item .mini{width:54px;flex:none;border-radius:6px;overflow:hidden;aspect-ratio:3/4}
.ai-item .mini svg,.ai-item .mini img{width:100%;height:100%;object-fit:cover}
@media (max-width:860px){.ai{grid-template-columns:1fr}}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,5,12,.75);z-index:80;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-family:var(--display);font-size:24px;margin:0 0 14px;color:var(--white)}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.modal .grid2{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.toasts{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:10px;padding:12px 16px;min-width:240px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease-out}
.toast.err{border-left-color:var(--danger)}

@keyframes tin{from{transform:translateY(8px);opacity:0}}
footer{border-top:1px solid var(--line);margin-top:70px;padding:30px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lightbox img{max-height:80vh;margin:0 auto;border-radius:var(--r-sm)}

const now = () => Date.now();
const newId = p => p + now().toString(36) + Math.random().toString(36).slice(2, 8);
function ago(t) {
  const s = (now() - t) / 1000;
  if (!(s >= 0)) return '';
  if (s < 60) return 'hace un momento';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if (s < 2592000) return `hace ${Math.floor(s / 86400)} d`;
  return new Date(t).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
}
function stars(v, big) {
  if (v == null) return '<span class="stars" aria-label="Sin valoraciones"><span class="off">☆☆☆☆☆</span></span>';
  const n = Math.round(v);
  return `<span class="stars" aria-label="${v.toFixed(1)} de 5"${big ? ' style="font-size:22px"' : ''}>${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>`;
}
function slugify(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.setAttribute('role', kind === 'err' ? 'alert' : 'status'); t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3500);
}
function wrapTitle(name, max) {
  const out = []; let cur = '';
  for (const w of String(name).split(/\s+/)) {
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  return out;
}

/* ---------- derived data ---------- */
const gamesArr = () => Object.entries(S.games).map(([id, g]) => ({ ...g, id }));
const game = id => S.games[id] ? { ...S.games[id], id } : null;
const banned = uid => !!S.bans[uid];
function derive() {
  const per = {};
  const P = id => per[id] || (per[id] = { sum: 0, n: 0, favs: 0, comments: 0 });
  for (const [uid, d] of Object.entries(S.reviews)) {
    if (banned(uid)) continue;
    for (const [gid, r] of Object.entries(d.items || {})) if (S.games[gid] && r.r >= 1 && r.r <= 5) { const p = P(gid); p.sum += r.r; p.n++; }
  }
  for (const [uid, d] of Object.entries(S.favs)) {
    if (banned(uid)) continue;
    for (const gid of (d.ids || [])) if (S.games[gid]) P(gid).favs++;
  }
  for (const [uid, d] of Object.entries(S.comments)) {
    if (banned(uid)) continue;
    for (const c of Object.values(d.items || {})) if (S.games[c.g]) P(c.g).comments++;
  }
  const list = gamesArr().map(g => {
    const p = per[g.id] || { sum: 0, n: 0, favs: 0, comments: 0 };
    return Object.assign(g, { avg: p.n ? p.sum / p.n : null, nrev: p.n, nfav: p.favs, ncom: p.comments, pop: p.favs * 3 + p.n * 2 + p.comments });
  });
  D = { per, list, byId: Object.fromEntries(list.map(g => [g.id, g])) };
}
function allReviews() {
  const out = [];
  for (const [uid, d] of Object.entries(S.reviews)) if (!banned(uid))
    for (const [gid, r] of Object.entries(d.items || {})) if (S.games[gid]) out.push({ uid, gid, ...r });
  return out.sort((a, b) => (b.at || 0) - (a.at || 0));
}
function allComments() {
  const out = [];
  for (const [uid, d] of Object.entries(S.comments)) if (!banned(uid))
    for (const [cid, c] of Object.entries(d.items || {})) if (S.games[c.g]) out.push({ uid, cid, ...c });
  return out.sort((a, b) => (b.at || 0) - (a.at || 0));
}
const myFavs = () => (S.uid && S.favs[S.uid]?.ids) || [];
const isFav = gid => myFavs().includes(gid);
function displayName(uid) {
  const a = S.profiles[uid]?.alias;

async function resolveNames() {
  if (!S.user) return;
  const ids = new Set([...Object.keys(S.reviews), ...Object.keys(S.comments), ...Object.keys(S.favs), ...Object.keys(S.profiles)]);
  const need = [...ids].filter(id => !S.nameReq.has(id));
  if (!need.length) return;
  need.forEach(id => S.nameReq.add(id));
  try {
    const ps = await S.user.profiles(need);

  } catch { /* names stay generic */ }
}

/* ---------- writes ---------- */
const queues = {};
function queued(path, fn) {
  const p = (queues[path] || Promise.resolve()).then(fn);
  queues[path] = p.catch(() => {});
  return p;
}
function writeErr(e, ownData) {
  if (e && e.code === 'invalid_argument' && ownData) {
    S.readOnly = true; scheduleRefresh();
    toast('Tu acceso a esta página es de solo lectura. Pide al dueño acceso de colaborador para participar.', 'err');
  } else if (e && e.code === 'rate_limited') toast('Demasiadas acciones seguidas. Espera unos segundos.', 'err');
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.', 'err');
}
async function put(path, data, ownData = true) {
  if (!S.db) { toast('El almacenamiento no está disponible en esta vista.', 'err'); return false; }
  try { await queued(path, () => S.db.doc(path).set(data)); return true; }
  catch (e) { writeErr(e, ownData); return false; }
}
async function remove(path, ownData = false) {
  try { await queued(path, () => S.db.doc(path).delete()); return true; }
  catch (e) { writeErr(e, ownData); return false; }
}
function canPost() {
  if (!S.uid) return 'Tu navegador no permite guardar datos locales.';
  if (S.readOnly) return 'Tu acceso es de solo lectura.';
  if (banned(S.uid)) return 'Tu cuenta está suspendida por moderación.';
  return '';
}
function cooldownLeft() { return Math.max(0, COOLDOWN - (now() - S.lastPost)); }

/* ---------- data loading ---------- */
function collect(qs) { const m = {}; qs.docs.forEach(d => { m[d.id] = d.data() || {}; }); return m; }
function subscribe(path, assign, critical) {
  return S.db.collection(path).onSnapshot(qs => { assign(collect(qs)); S.ready.add(path); changed(); }, e => {
    if (critical) { S.error = 'No se pudo conectar con la base de datos de la plataforma.'; S.loading = false; scheduleRefresh(); }
    console.warn('db', path, e && e.code);
  });
}
function changed() { derive(); resolveNames(); scheduleRefresh(); }

async function boot() {
  route();
  if (!window.claude || typeof window.claude.use !== 'function') {
    S.loading = false; S.error = 'No se pudo iniciar la capa de datos local.'; scheduleRefresh(); return;
  }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  S.db = db; S.user = user;
  if (!db) { S.loading = false; S.error = 'No se pudo cargar la base de datos. Verifica que hayas iniciado sesión en claude.ai.'; scheduleRefresh(); return; }
  if (user) {
    try { S.uid = await user.id(); } catch { S.uid = null; }
    try { S.admin = await user.canEdit(); } catch { S.admin = false; }
    try { if (S.uid) S.names[S.uid] = (await user.name()) || ''; } catch {}
  }
  $('#nav-admin').hidden = !S.admin;
  renderMe();
  const timer = setTimeout(() => { if (S.loading) { S.loading = false; S.error = 'El catálogo tardó demasiado en cargar. Recarga la página para intentarlo de nuevo.'; scheduleRefresh(); } }, 10000);
  S.db.collection('catalog').onSnapshot(qs => {
    clearTimeout(timer); S.loading = false; S.error = null; S.games = collect(qs); changed();
  }, () => { clearTimeout(timer); S.loading = false; S.error = 'No se pudo cargar el catálogo.'; scheduleRefresh(); });
  subscribe('config', m => {
    S.genres = Array.isArray(m.genres?.list) ? m.genres.list.filter(x => typeof x === 'string') : [];
    S.bans = (m.bans && m.bans.ids) || {};
  });
  subscribe('ads', m => { S.ads = m; });
  subscribe('reviews', m => { S.reviews = m; });
  subscribe('comments', m => { S.comments = m; });
  subscribe('favs', m => { S.favs = m; });
  subscribe('profiles', m => { S.profiles = m; renderMe(); });
  if (S.admin) subscribe('reports', m => { S.reports = m; });
  if (S.uid) {
    S.db.doc(`data/users/${S.uid}/me`).onSnapshot(d => {
      const v = d.exists ? d.data() : {};
      S.priv = { library: v.library || {}, history: Array.isArray(v.history) ? v.history : [] }; S.privLoaded = true;
      scheduleRefresh(); logView();
    }, () => {});
  }
  claude.use('sample').then(s => { S.sample = s; scheduleRefresh(); });
  if (S.admin) claude.use('assets').then(a => { S.assets = a; });
}

/* ---------- rendering infrastructure ---------- */
let refreshPending = false;
function scheduleRefresh() {
  if (refreshPending) return;
  refreshPending = true;
  requestAnimationFrame(() => { refreshPending = false; refresh(); });
}
function fill(el, html) {
  const keep = {}; let fk = null, sel = null;
  $$('[data-keep]', el).forEach(i => {
    keep[i.dataset.keep] = i.value;
    if (document.activeElement === i) { fk = i.dataset.keep; try { sel = [i.selectionStart, i.selectionEnd]; } catch {} }
  });
  el.innerHTML = html;
  for (const [k, v] of Object.entries(keep)) { const i = el.querySelector(`[data-keep="${CSS.escape(k)}"]`); if (i) i.value = v; }
  if (fk) { const i = el.querySelector(`[data-keep="${CSS.escape(fk)}"]`); if (i) { i.focus(); try { if (sel) i.setSelectionRange(sel[0], sel[1]); } catch {} } }
}
function refresh(only) {
  $$('[data-region]', $('#main')).forEach(el => {
    const name = el.dataset.region;
    if (only && !only.includes(name)) return;
    const fn = REGIONS[name];
    if (fn) {
      const out = fn(el);
      if (typeof out === 'string') {
        fill(el, out);
        if (!el.dataset.seen && el.querySelector('.card')) { el.dataset.seen = '1'; el.classList.add('first'); setTimeout(() => el.classList.remove('first'), 1400); }
        else el.classList.remove('first');
      }
    }
  });
  logView();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || 'inicio');
  let r = h, p = null;
  if (h.startsWith('juego-')) { r = 'juego'; p = h.slice(6); }
  if (!VIEWS[r]) r = 'inicio';
  const same = r === S.route && p === S.param && $('#main').childElementCount;
  S.route = r; S.param = p;
  if (r !== 'juego') { S.replyTo = null; S.loggedView = null; }
  $$('#nav a').forEach(a => { if (a.dataset.nav === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#nav').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false');
  if (same) return;
  $('#main').innerHTML = VIEWS[r]();
  if (r === 'explorar') syncFilterInputs();
  refresh();
  window.scrollTo(0, 0);
}
function renderMe() {
  const slot = $('#me-slot');
  if (!S.uid) {
    slot.innerHTML = `<button class="me-chip" type="button" data-act="guest-info"><span class="av">👤</span><span class="nm">Invitado</span></button>`;

/* ---------- regions ---------- */
function deckPos(i, cur, n) { const d = (i - cur + n) % n; return d === 0 ? '0' : d === 1 ? '1' : d === n - 1 ? '2' : 'h'; }
function rotateDeck() {
  const el = $('[data-region="deck"]'); if (!el || !S.deckN || el.matches(':hover') || el.contains(document.activeElement)) return;
  S.deckI = (S.deckI + 1) % S.deckN;
  $$('a', el).forEach((a, i) => { const p = deckPos(i, S.deckI, S.deckN); a.dataset.pos = p; a.tabIndex = p === '0' ? 0 : -1; });
}
function filtered() {
  const f = S.f, q = f.q.trim().toLowerCase();
  let list = D.list.filter(g =>
    (!q || g.name.toLowerCase().includes(q)) && (!f.genre || g.genre === f.genre) &&
    (!f.year || String(g.year) === f.year) && (!f.dev || g.developer === f.dev));
  const by = {
    az: (a, b) => a.name.localeCompare(b.name, 'es'), za: (a, b) => b.name.localeCompare(a.name, 'es'),
    pop: (a, b) => b.pop - a.pop || a.name.localeCompare(b.name, 'es'),
    rating: (a, b) => (b.avg ?? -1) - (a.avg ?? -1) || b.nrev - a.nrev,
    new: (a, b) => (b.year || 0) - (a.year || 0), old: (a, b) => (a.year || 0) - (b.year || 0)
  };
  return list.sort(by[f.sort] || by.az);
}
function syncFilterInputs() {
  const m = { 'f-q': 'q', 'f-genre': 'genre', 'f-year': 'year', 'f-dev': 'dev', 'f-sort': 'sort' };
  for (const [id, k] of Object.entries(m)) { const el = $('#' + id); if (el) el.value = S.f[k]; }
}
function setOptions(sel, values, allLabel, want) {
  if (!sel) return;
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = values.map(String).includes(String(want)) ? String(want) : '';
}
function ranked() { return D.list.filter(g => g.pop > 0).sort((a, b) => b.pop - a.pop || a.name.localeCompare(b.name, 'es')); }

  if (S.loading) return `<div class="detail"><div class="sk"></div><div></div></div>`;
  if (!cur()) return `<div style="margin-top:34px">${emptyBox('Este juego no está en el catálogo', 'Puede que lo hayan retirado o que el enlace esté mal.', '<br><a class="btn sm" href="#explorar">Volver al catálogo</a>')}</div>`;
  return '';
}
Object.assign(REGIONS, {
  detail: () => {

    const g = cur(), fav = isFav(g.id), lib = S.priv.library[g.id] || '';
    const fact = (k, v) => v ? `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>` : '';
    const langs = Array.isArray(g.languages) && g.languages.length ? g.languages.join(', ') : '';
    const block = canPost();
    return `<div class="detail"><div class="cover">${coverArt(g)}</div><div>
<h1>${esc(g.name)}</h1>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${stars(g.avg, true)}<span style="color:var(--muted)">${g.avg != null ? `${g.avg.toFixed(1)} de 5, ${g.nrev} ${g.nrev === 1 ? 'reseña' : 'reseñas'}` : 'Sin calificaciones todavía'}</span>
${g.essential ? '<span class="badge">Imprescindible</span>' : ''}</div>
<dl class="facts">${fact('Género', g.genre)}${fact('Año de lanzamiento', g.year)}${fact('Desarrolladora', g.developer)}${fact('Distribuidora', g.publisher)}${fact('Idiomas', langs)}${fact('Favoritos', String(g.nfav))}</dl>
<p class="desc">${esc(g.description || '')}</p>
<div class="actions" style="margin-top:18px">
  <button class="icon-btn" type="button" data-act="fav" data-v="${esc(g.id)}" aria-pressed="${fav}"${block ? ` title="${esc(block)}"` : ''}>${fav ? '♥ En favoritos' : '♡ Agregar a favoritos'}</button>

  ${S.admin ? `<button class="btn ghost sm" type="button" data-act="admin-game-edit" data-v="${esc(g.id)}">Editar ficha</button>` : ''}
</div></div></div>`;
  },
  shots: () => {
    const g = !detailGuard() && cur(); if (!g) return '';

    if (!shots.length) return '';
    return `<section class="sec"><div class="sec-h"><div><h2>Capturas</h2></div></div><div class="shots">${shots.map((id, i) => `<img src="/_blob/${id}" alt="Captura ${i + 1} de ${esc(g.name)}" loading="lazy" data-act="shot" data-v="${id}">`).join('')}</div></section>`;
  },
  related: () => {
    const g = !detailGuard() && cur(); if (!g) return '';
    const l = D.list.filter(x => x.id !== g.id && (x.genre === g.genre || x.developer === g.developer))
      .sort((a, b) => ((b.genre === g.genre) + (b.developer === g.developer)) - ((a.genre === g.genre) + (a.developer === g.developer)) || b.pop - a.pop).slice(0, 10);
    return l.length ? rail(l) : emptyBox('Sin relacionados', 'No hay otros juegos de este género o estudio en el catálogo.');
  },
  'review-form': () => {
    const g = !detailGuard() && cur(); if (!g) return '';

    if (block) return `<h3 style="margin:0 0 6px;font-family:var(--display)">Tu reseña</h3><p style="color:var(--muted);margin:0">${esc(block)}</p>`;
    const mine = S.reviews[S.uid]?.items?.[g.id];
    const n = S.draftStars[g.id] ?? (mine ? mine.r : 0);
    return `<h3 style="margin:0 0 10px;font-family:var(--display)">${mine ? 'Edita tu reseña' : 'Tu reseña'}</h3>
<div class="starpick" role="radiogroup" aria-label="Calificación">${[1, 2, 3, 4, 5].map(i => `<button type="button" role="radio" aria-checked="${i === n}" aria-label="${i} de 5" class="${i <= n ? 'on' : ''}" data-act="star" data-v="${i}">★</button>`).join('')}</div>
<label class="sr" for="rv-t">Texto de la reseña</label>
<textarea class="inp" id="rv-t" data-keep="rv-${esc(g.id)}" maxlength="${MAX_REVIEW}" placeholder="¿Qué tal envejeció? ¿Lo recomiendas?" style="margin-top:10px">${mine ? esc(mine.t || '') : ''}</textarea>
<div class="form-row"><span class="counter">Máximo ${MAX_REVIEW} caracteres</span>${mine ? '<button class="link-btn" type="button" data-act="review-del">Eliminar</button>' : ''}<button class="btn sm" type="button" data-act="review-save">${mine ? 'Actualizar reseña' : 'Publicar reseña'}</button></div>`;
  },
  reviews: () => {
    const g = !detailGuard() && cur(); if (!g) return '';
    const l = allReviews().filter(r => r.gid === g.id);
    if (!l.length) return emptyBox('Sin reseñas', 'Sé el primero en calificar este juego.');
    return l.map(r => postHTML({ uid: r.uid, text: r.t, at: r.at, extra: stars(r.r), actions: contentActions('review', r.uid, r.gid) })).join('');
  },
  'comment-form': () => {
    const g = !detailGuard() && cur(); if (!g) return '';
    const block = canPost();
    if (block) return `<p style="color:var(--muted);margin:0 0 10px">${esc(block)}</p>`;
    return `<label class="sr" for="cm-t">Escribe un comentario</label><textarea class="inp" id="cm-t" data-keep="cm-${esc(g.id)}" maxlength="${MAX_COMMENT}" placeholder="Comparte un recuerdo, un truco o una pregunta"></textarea>
<div class="form-row"><span class="counter">Máximo ${MAX_COMMENT} caracteres</span><button class="btn sm" type="button" data-act="comment-post">Comentar</button></div>`;
  },
  comments: () => {
    const g = !detailGuard() && cur(); if (!g) return '';
    const l = allComments().filter(c => c.g === g.id);
    if (!l.length) return emptyBox('Nadie ha comentado', 'Abre la conversación.');
    const ids = new Set(l.map(c => c.cid));
    const tops = l.filter(c => !c.p || !ids.has(c.p));
    const kids = p => l.filter(c => c.p === p).sort((a, b) => a.at - b.at);
    const one = c => postHTML({ uid: c.uid, text: c.t, at: c.at, actions: contentActions('comment', c.uid, c.cid, true) });
    return tops.map(c => {
      const ch = kids(c.cid);
      const replyForm = S.replyTo === c.cid ? `<div class="replies"><label class="sr" for="rp-t">Respuesta</label><textarea class="inp" id="rp-t" data-keep="rp-${esc(c.cid)}" maxlength="${MAX_COMMENT}" placeholder="Tu respuesta"></textarea>

      return one(c) + (ch.length ? `<div class="replies">${ch.map(one).join('')}</div>` : '') + replyForm;
    }).join('');
  }
});
function contentActions(kind, owner, key, canReply) {
  const out = [];
  if (canReply && !canPost()) out.push(`<button class="link-btn" type="button" data-act="reply" data-v="${esc(key)}">Responder</button>`);
  if (owner === S.uid) out.push(`<button class="link-btn" type="button" data-act="own-del" data-k="${kind}" data-v="${esc(key)}">Eliminar</button>`);
  else if (S.uid && !S.readOnly) out.push(`<button class="link-btn" type="button" data-act="report" data-k="${kind}" data-o="${esc(owner)}" data-v="${esc(key)}">Reportar</button>`);
  if (S.admin && owner !== S.uid) out.push(`<button class="link-btn" type="button" data-act="mod-del" data-k="${kind}" data-o="${esc(owner)}" data-v="${esc(key)}" style="color:var(--danger)">Borrar (moderación)</button>`);
  return out.length ? `<div style="margin-top:2px">${out.join('')}</div>` : '';
}
function logView() {
  const g = S.route === 'juego' && cur();
  if (!g || !S.uid || S.readOnly || !S.privLoaded || S.loggedView === g.id) return;
  S.loggedView = g.id;
  const h = [{ g: g.id, at: now() }, ...S.priv.history.filter(x => x.g !== g.id)].slice(0, 30);
  put(`data/users/${S.uid}/me`, { library: S.priv.library, history: h });
}

/* ---------- modals ---------- */
let modalClose = null;
function openModal(html, onMount) {
  closeModal();
  const prev = document.activeElement;
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const bg = root.firstElementChild;
  const onKey = e => { if (e.key === 'Escape') closeModal(); };
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  document.addEventListener('keydown', onKey);
  modalClose = () => { document.removeEventListener('keydown', onKey); root.innerHTML = ''; modalClose = null; if (prev && prev.focus) prev.focus(); };
  const first = $('input,select,textarea,button', bg); if (first) first.focus();
  if (onMount) onMount($('.modal', bg));
}
function closeModal() { if (modalClose) modalClose(); }
function confirmBox(title, text, okLabel = 'Confirmar', danger = true) {
  return new Promise(res => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeModal(); res(v); };
    openModal(`<h3>${esc(title)}</h3><p style="color:var(--muted)">${esc(text)}</p><div class="form-row"><button class="link-btn" type="button" data-m="no">Cancelar</button><button class="btn sm ${danger ? 'danger' : ''}" type="button" data-m="yes">${esc(okLabel)}</button></div>`, m => {
      m.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) finish(b.dataset.m === 'yes'); });
      const prevClose = modalClose; modalClose = () => { prevClose(); if (!done) { done = true; res(false); } };
    });
  });
}

<div style="display:flex;gap:18px;margin-top:12px;flex-wrap:wrap"><label class="check"><input type="checkbox" id="g-feat"${g.featured ? ' checked' : ''}> Destacado</label><label class="check"><input type="checkbox" id="g-ess"${g.essential ? ' checked' : ''}> Imprescindible</label></div>
${S.assets ? `<div class="fld" style="margin-top:14px"><span class="lb">Portada (opcional, reemplaza la generada)</span><div id="g-cover-st" class="sub"></div><input type="file" id="g-cover" accept="image/png,image/jpeg,image/webp"></div>
<div class="fld" style="margin-top:12px"><span class="lb">Capturas de pantalla</span><div id="g-shots-st"></div><input type="file" id="g-shots" accept="image/png,image/jpeg,image/webp" multiple></div>` : '<p class="sub" style="color:var(--muted)">La subida de imágenes no está disponible en esta vista.</p>'}
<div id="g-err" class="notice err" hidden style="margin-top:12px"></div>
<div class="form-row"><button class="link-btn" type="button" data-m="cancel">Cancelar</button><button class="btn sm" type="submit">${id ? 'Guardar cambios' : 'Agregar al catálogo'}</button></div></form>`, m => {

      const cs = $('#g-cover-st', m), ss = $('#g-shots-st', m);
      if (cs) cs.innerHTML = st.cover ? `Portada subida. <button class="link-btn" type="button" data-m="cover-x">Quitar</button>` : 'Se usa la portada generada.';
      if (ss) ss.innerHTML = st.shots.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${st.shots.map((s, i) => `<span style="position:relative"><img src="/_blob/${s}" alt="" style="width:90px;height:68px;object-fit:cover;border-radius:6px"><button class="link-btn" type="button" data-m="shot-x" data-i="${i}" aria-label="Quitar captura ${i + 1}">✕</button></span>`).join('')}</div>` : '<span class="sub">Sin capturas.</span>';
    };
    drawImgs();
    const up = async file => {
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error('Formato no permitido. Usa PNG, JPG o WEBP.');

      if (e.target.type === 'file') e.target.value = '';
    });
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;

      if (b.dataset.m === 'cover-x') { st.cover = null; drawImgs(); }

      const slug = id || slugify(name);
      if (!SLUG.test(slug)) return err('El nombre no genera un identificador válido.');
      if (!id && S.games[slug]) return err('Ya existe un juego con ese nombre.');
      const data = {
        name, description: v('#g-desc'), genre: v('#g-genre'), year, developer: v('#g-dev'), publisher: v('#g-pub'),
        languages: v('#g-langs') ? v('#g-langs').split(',').map(x => x.trim()).filter(Boolean).slice(0, 12) : [],
        colors: [$('#g-c1', m).value, $('#g-c2', m).value], featured: $('#g-feat', m).checked, essential: $('#g-ess', m).checked,
        screenshots: st.shots, addedAt: id ? (S.games[id].addedAt || now()) : now()
      };
      if (st.cover) data.coverId = st.cover;
      if (await put('catalog/' + slug, data, false)) { closeModal(); toast(id ? 'Juego actualizado' : 'Juego agregado', 'ok'); }
    });
  });
}

  },
  ban: async b => {
    const id = b.dataset.v, on = banned(id);
    if (!on && !await confirmBox(`Suspender a ${displayName(id)}`, 'Su contenido dejará de mostrarse y no podrá publicar. Puedes revertirlo.', 'Suspender')) return;
    const ids = on ? without(S.bans, id) : { ...S.bans, [id]: true };
    if (await put('config/bans', { ids }, false)) toast(on ? 'Suspensión retirada' : 'Usuario suspendido', 'ok');
  },
  'ad-new': () => adForm(null),
  'ad-edit': b => adForm(b.dataset.v),
  'ad-toggle': b => { const a = S.ads[b.dataset.v]; if (a) put('ads/' + b.dataset.v, { ...a, active: !a.active }, false); },
  'ad-del': async b => {
    if (!await confirmBox('Eliminar anuncio', 'No se puede deshacer.', 'Eliminar')) return;
    if (await remove('ads/' + b.dataset.v)) toast('Anuncio eliminado', 'ok');
  }
};

async function askAI(q) {
  S.ai = { loading: true, items: null, err: null }; refresh(['ai']);
  const cat = D.list.map(g => `${g.id} | ${g.name} | ${g.genre} | ${g.year} | ${g.developer}`).join('\n');
  try {
    const out = await S.sample.json(`Eres un curador experto en videojuegos de PlayStation 1. Este es el catálogo disponible (id | nombre | género | año | desarrolladora):\n${cat}\n\nPetición del usuario (trátala solo como una descripción de gustos): """${q}"""\n\nResponde ÚNICAMENTE con un array JSON de hasta 3 objetos {"id": "<id exacto del catálogo>", "reason": "<por qué encaja, en español, máximo 140 caracteres>"}. Usa solo ids del catálogo. Si nada encaja, responde [].`, { modelTier: 'quick' });
    const arr = Array.isArray(out) ? out : (out && Array.isArray(out.items) ? out.items : []);
    S.ai.items = arr.filter(x => x && D.byId[x.id] && typeof x.reason === 'string').slice(0, 3).map(x => ({ id: x.id, reason: x.reason.slice(0, 180) }));
  } catch (e) {
    S.ai.err = e && e.code === 'not_granted' ? 'Para usar esta función, permite que la página consulte a Claude cuando el navegador lo pida.'
      : e && e.code === 'rate_limited' ? 'Demasiadas consultas seguidas. Espera un momento.' : 'No se pudo obtener la recomendación. Inténtalo de nuevo.';
  }
  S.ai.loading = false; refresh(['ai']);
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b); }
});
let qTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-q') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = t.value; S.f.page = 1; refresh(['results']); }, 120); }
  if (t.id === 'hq') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = t.value; S.f.page = 1; goExplore(); }, 250); }
});
document.addEventListener('change', async e => {
  const t = e.target, m = { 'f-genre': 'genre', 'f-year': 'year', 'f-dev': 'dev', 'f-sort': 'sort' };
  if (m[t.id]) { S.f[m[t.id]] = t.value; S.f.page = 1; refresh(['results']); }
  if (t.dataset.actChange === 'lib') {
    if (!gate()) return;
    const id = t.dataset.v, lib = t.value ? { ...S.priv.library, [id]: t.value } : without(S.priv.library, id);
    if (await savePriv(lib, S.priv.history)) toast(t.value ? `Marcado como ${LIB[t.value].toLowerCase()}` : 'Quitado de tu biblioteca', 'ok');
  }
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'hsearch') { e.preventDefault(); S.f.q = $('#hq').value; S.f.page = 1; goExplore(); }
  if (f.id === 'ai-form') { e.preventDefault(); const q = $('#ai-q').value.trim(); if (q && !S.ai.loading) askAI(q.slice(0, 200)); }
  if (f.id === 'genre-form') {
    e.preventDefault();
    const n = $('#new-genre').value.trim().replace(/\s+/g, ' ');
    if (n.length < 3 || n.length > 24) return toast('La categoría debe tener entre 3 y 24 caracteres.', 'err');
    if (S.genres.some(x => x.toLowerCase() === n.toLowerCase())) return toast('Esa categoría ya existe.', 'err');
    if (await put('config/genres', { list: [...S.genres, n] }, false)) { $('#new-genre').value = ''; toast('Categoría agregada', 'ok'); }
  }
});
$('#menu-btn').addEventListener('click', () => {
  const open = $('#nav').classList.toggle('open');
  $('#menu-btn').setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', route);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduceMotion && matchMedia('(hover: hover) and (pointer: fine)').matches) {
  let last = null;
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest('.card');
    if (last && last !== c) { last.style.removeProperty('--rx'); last.style.removeProperty('--ry'); last = null; }
    if (!c) return;
    const f = c.querySelector('.frame'); if (!f) return;
    const r = f.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    c.style.setProperty('--ry', ((x - 0.5) * 14).toFixed(2) + 'deg');
    c.style.setProperty('--rx', ((0.5 - y) * 12).toFixed(2) + 'deg');
    c.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
    c.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    last = c;
  }, { passive: true });
}
if (!reduceMotion) setInterval(rotateDeck, 3800);
setInterval(() => { if (['comunidad', 'juego'].includes(S.route) && !document.querySelector('[data-keep]:focus')) refresh(['feed-reviews', 'feed-comments', 'reviews', 'comments']); }, 60000);
renderMe();
boot();
})();
</script>
</body></html>
