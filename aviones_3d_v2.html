<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Superiority 3D v2 — Combate Aéreo Retro 2.5D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f18;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 12px;
  }
  #game-container {
    position: relative;
    box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
    border: 4px solid #1a2a40;
  }
  #game-container { width: min(800px, 100%); }
  canvas { display: block; background: #000; width: 100%; height: auto; }
  .hud-panel {
    margin-top: 10px;
    width: min(800px, 100%);
    background: #111a28;
    border: 2px solid #223550;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
    color: #70d0ff;
  }
  @media(max-width:600px){ .hud-panel {font-size:11px} .controls-info {font-size:10px} }
  .controls-info {
    margin-top: 8px;
    font-size: 11px;
    color: #88a0c0;
    text-align: center;
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="800" height="500"></canvas>
</div>

<div class="hud-panel">
  <div><strong>W/S o ↑/↓:</strong> Altitud | <strong>A/D o ←/→:</strong> Inclinación</div>
  <div><strong>ESPACIO / F:</strong> Cañón | <strong>B / E:</strong> Bomba | <strong>P / ESC:</strong> Pausa</div>
</div>
<div class="controls-info">
  Los disparos salen en línea recta hacia el círculo verde de la mira · Los enemigos también disparan · Recoge los power-ups
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Constantes de proyección y juego ----------
  const HORIZON = 180;       // línea del horizonte en pantalla
  const FOCAL = 300;         // distancia de la cámara a la pantalla
  const AIM_Z = 700;         // profundidad donde está la mira
  const GROUND_Y = 420;      // altura del suelo respecto a la cámara (para la cuadrícula)
  const LIMIT_X = 330, MIN_Y = 40, MAX_Y = 300;
  const PLAYER_R = 50;
  const BULLET_SPEED = 1700; // unidades de profundidad por segundo
  const BULLET_DMG = 7;
  const HIGH_KEY = 'air_superiority_highscore';

  // Proyección 3D -> pantalla. z es profundidad: cuanto más lejos, más pequeño.
  function proj(x, y, z) {
    const s = FOCAL / (FOCAL + Math.max(z, -FOCAL * 0.8));
    return { x: W / 2 + x * s, y: HORIZON + y * s, s };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  const ENEMY_TYPES = {
    fighter:  { hp: 28, speed: 260, r: 46, size: 90,  color: '#e67e22', fire: 2.6, score: 100 },
    heavy:    { hp: 70, speed: 150, r: 62, size: 130, color: '#d63031', fire: 1.6, score: 250 },
    kamikaze: { hp: 18, speed: 340, r: 40, size: 70,  color: '#fd79a8', fire: 0,   score: 150 }
  };

  const PICKUP_TYPES = [
    { k: 'H', c: '#2ecc71' },  // vida
    { k: 'R', c: '#f1c40f' },  // disparo rápido
    { k: 'B', c: '#e84393' },  // bomba extra
    { k: 'S', c: '#74b9ff' }   // escudo
  ];

  // ---------- Estado ----------
  let state = 'MENU';
  let level, score, bombs, highScore;
  let player, enemies, bullets, enemyBullets, particles, pickups;
  let toSpawn, spawnTimer, waveDelay, bannerT;
  let scrollZ, shake, flashW, damageFlash, time, gameOverT;
  const keys = {};

  function loadHigh() {
    try { return parseInt(localStorage.getItem(HIGH_KEY) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveHigh(v) {
    try { localStorage.setItem(HIGH_KEY, String(v)); } catch (e) { /* sin almacenamiento */ }
  }

  function resetGame() {
    level = 1;
    score = 0;
    bombs = 3;
    player = { x: 0, y: 200, vx: 0, vy: 0, bank: 0, hp: 100, cooldown: 0, shield: 0, rapid: 0, inv: 0 };
    enemies = [];
    bullets = [];
    enemyBullets = [];
    particles = [];
    pickups = [];
    toSpawn = 0;
    spawnTimer = 0;
    waveDelay = 1.6;
    bannerT = 2;
    scrollZ = 0;
    shake = 0;
    flashW = 0;
    damageFlash = 0;
    gameOverT = 0;
    time = 0;
  }

  function startGame() {
    resetGame();
    state = 'PLAYING';
  }

  // ---------- Sonido (Web Audio, sin archivos externos) ----------
  let actx = null, noiseBuf = null;
  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    return actx;
  }
  function tone(freq, dur, type = 'square', vol = 0.05, slideTo = null) {
    const a = audio();
    if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur);
  }
  function boom(dur = 0.5, vol = 0.12) {
    const a = audio();
    if (!a) return;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = a.createBufferSource();
    src.buffer = noiseBuf;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    src.connect(g).connect(a.destination);
    src.start();
    src.stop(a.currentTime + dur);
  }

  // ---------- Partículas (en pantalla) ----------
  function burst(sx, sy, color, n, speed, life) {
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = speed * rand(0.4, 1);
      particles.push({
        x: sx, y: sy,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life, max: life, color, size: rand(2, 4)
      });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Oleadas y enemigos ----------
  function startWave() {
    toSpawn = Math.min(4 + level * 2, 18);
    spawnTimer = 0.5;
  }

  function spawnEnemy() {
    let type = 'fighter';
    const r = Math.random();
    if (level >= 3 && r < 0.2) type = 'kamikaze';
    else if (level >= 2 && r < 0.45) type = 'heavy';
    const t = ENEMY_TYPES[type];
    const mult = 1 + (level - 1) * 0.08;
    const hp = t.hp * mult;
    enemies.push({
      type,
      x: rand(-260, 260), y: rand(-60, 160), z: rand(650, 850),
      hp, maxHp: hp,
      speed: t.speed * mult,
      fire: t.fire,
      fireT: t.fire ? rand(1, t.fire + 1) : 0,
      phase: Math.random() * 6,
      flash: 0,
      alive: true
    });
  }

  function updateEnemy(e, dt) {
    const t = ENEMY_TYPES[e.type];
    e.phase += dt;
    e.flash = Math.max(0, e.flash - dt);
    e.z -= e.speed * dt;

    if (e.type === 'heavy') e.x += Math.sin(e.phase * 1.4) * 80 * dt;

    // Persecución suave; el kamikaze se lanza con más fuerza
    const hom = e.type === 'kamikaze' ? 1.6 : 0.3;
    e.x += (player.x - e.x) * hom * dt;
    e.y += (player.y - e.y) * hom * dt;

    // Disparo enemigo cuando está a distancia media
    if (e.fire) {
      e.fireT -= dt;
      if (e.fireT <= 0 && e.z < 700 && e.z > 150) {
        e.fireT = t.fire * rand(0.8, 1.2);
        fireEnemyBullet(e);
      }
    }

    // Choque con el avión
    if (e.alive && e.z < 40 && e.z > -60) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < t.r * 0.7 + PLAYER_R * 0.5) {
        destroy(e, 0);
        hurtPlayer(25);
      }
    }

    if (e.z < -150) e.alive = false; // escapó
  }

  function destroy(e, points) {
    if (!e.alive) return;
    e.alive = false;
    score += points;
    const p = proj(e.x, e.y, e.z);
    burst(p.x, p.y, '#ffcc66', 24, 220, 0.6);
    burst(p.x, p.y, '#ff5533', 14, 140, 0.8);
    boom(0.5, 0.1);
    shake = Math.max(shake, 6);
    if (Math.random() < 0.15) {
      const type = PICKUP_TYPES[Math.floor(Math.random() * PICKUP_TYPES.length)];
      pickups.push({ x: e.x, y: e.y, z: e.z, type, t: 12 });
    }
  }

  // ---------- Disparos del jugador (línea recta, precisos) ----------
  function firePlayer() {
    player.cooldown = player.rapid > 0 ? 0.06 : 0.13;
    bullets.push(
      { x: player.x - 16, y: player.y, z: 0, pz: 0, dead: false },
      { x: player.x + 16, y: player.y, z: 0, pz: 0, dead: false }
    );
    tone(880, 0.05, 'square', 0.025, 330);
  }

  function updatePlayerBullets(dt) {
    for (const b of bullets) {
      b.pz = b.z;
      b.z += BULLET_SPEED * dt;
      if (b.dead) continue;
      for (const e of enemies) {
        if (!e.alive) continue;
        const t = ENEMY_TYPES[e.type];
        // Impacto: la bala cruza la profundidad del enemigo y está dentro de su radio
        if (e.z >= b.pz - 25 && e.z <= b.z + 25 && Math.hypot(e.x - b.x, e.y - b.y) < t.r) {
          b.dead = true;
          e.hp -= BULLET_DMG;
          e.flash = 0.08;
          const p = proj(b.x, b.y, e.z);
          burst(p.x, p.y, '#ffeaa7', 4, 120, 0.25);
          tone(300, 0.04, 'sawtooth', 0.03);
          if (e.hp <= 0) destroy(e, t.score);
          break;
        }
      }
    }
    bullets = bullets.filter(b => !b.dead && b.z < 1800);
  }

  function drawPlayerBullet(b) {
    const p1 = proj(b.x, b.y, b.z);
    const p0 = proj(b.x, b.y, Math.max(0, b.z - 160));
    ctx.strokeStyle = '#ffeaa7';
    ctx.lineWidth = Math.max(1, 3 * p1.s + 0.5);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
  }

  // ---------- Disparos enemigos (apuntan al jugador) ----------
  function fireEnemyBullet(e) {
    const dx = player.x - e.x, dy = player.y - e.y, dz = -e.z;
    const len = Math.hypot(dx, dy, dz);
    const sp = 620;
    enemyBullets.push({
      x: e.x, y: e.y, z: e.z,
      vx: dx / len * sp, vy: dy / len * sp, vz: dz / len * sp,
      dmg: e.type === 'heavy' ? 18 : 12,
      dead: false
    });
  }

  function updateEnemyBullets(dt) {
    for (const b of enemyBullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.z += b.vz * dt;
      if (!b.dead && b.z <= 0) {
        b.dead = true;
        if (Math.hypot(b.x - player.x, b.y - player.y) < PLAYER_R * 0.8) hurtPlayer(b.dmg);
      }
    }
    enemyBullets = enemyBullets.filter(b => !b.dead && b.z > -50);
  }

  function drawEnemyBullet(b) {
    if (b.z <= 0) return;
    const p = proj(b.x, b.y, b.z);
    const r = Math.max(2, 8 * p.s);
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.4, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- Power-ups ----------
  function updatePickups(dt) {
    for (const p of pickups) {
      p.t -= dt;
      p.z -= 260 * dt;
      const dx = player.x - p.x, dy = player.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d < 180) { p.x += dx * 2 * dt; p.y += dy * 2 * dt; }
      if (p.z < 70 && p.z > -60 && d < 70) {
        applyPickup(p.type.k);
        p.t = -1;
      }
    }
    pickups = pickups.filter(p => p.t > 0 && p.z > -150);
  }

  function applyPickup(k) {
    tone(660, 0.08, 'triangle', 0.06, 990);
    if (k === 'H') player.hp = Math.min(100, player.hp + 30);
    if (k === 'R') player.rapid = 6;
    if (k === 'B') bombs++;
    if (k === 'S') player.shield = 5;
  }

  function drawPickup(p) {
    if (p.z <= 0) return;
    const pr = proj(p.x, p.y, p.z);
    const r = Math.max(6, 16 * pr.s);
    ctx.fillStyle = p.type.c;
    ctx.beginPath(); ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = `bold ${Math.max(8, Math.round(r * 1.1))}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.type.k, pr.x, pr.y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  // ---------- Jugador ----------
  function hurtPlayer(dmg) {
    if (state !== 'PLAYING' || player.inv > 0) return;
    if (player.shield > 0) {
      tone(600, 0.08, 'triangle', 0.05);
      return;
    }
    player.hp = Math.max(0, player.hp - dmg);
    player.inv = 0.6;
    shake = Math.max(shake, 12);
    damageFlash = 0.35;
    boom(0.35, 0.08);
    tone(140, 0.25, 'sawtooth', 0.06, 60);
    if (player.hp <= 0) gameOver();
  }

  function useBomb() {
    if (state !== 'PLAYING' || bombs <= 0) return;
    bombs--;
    flashW = 0.5;
    shake = Math.max(shake, 14);
    boom(1.0, 0.2);
    for (const e of enemies) {
      if (!e.alive || e.z <= 0) continue;
      e.hp -= 60;
      e.flash = 0.2;
      if (e.hp <= 0) destroy(e, ENEMY_TYPES[e.type].score);
    }
    enemyBullets = [];
  }

  function gameOver() {
    if (state !== 'PLAYING') return;
    state = 'GAMEOVER';
    gameOverT = 0;
    if (score > highScore) { highScore = score; saveHigh(score); }
    boom(1.2, 0.2);
  }

  function togglePause() {
    if (state === 'PLAYING') { state = 'PAUSED'; for (const k in keys) keys[k] = false; }
    else if (state === 'PAUSED') state = 'PLAYING';
  }

  function drawShape(size, body, cockpit) {
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.6);
    ctx.lineTo(size * 0.9, size * 0.3);
    ctx.lineTo(size * 0.25, size * 0.15);
    ctx.lineTo(size * 0.15, size * 0.5);
    ctx.lineTo(-size * 0.15, size * 0.5);
    ctx.lineTo(-size * 0.25, size * 0.15);
    ctx.lineTo(-size * 0.9, size * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = cockpit;
    ctx.beginPath();
    ctx.ellipse(0, -size * 0.1, size * 0.12, size * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    // parpadeo mientras es invulnerable
    if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;
    const p = proj(player.x, player.y, 0);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(player.bank * Math.PI / 180);
    ctx.fillStyle = '#ff7675';
    ctx.fillRect(-8, 65 * 0.35, 16, 8);
    drawShape(65, '#0984e3', '#ffeaa7');
    if (player.shield > 0) {
      ctx.strokeStyle = `rgba(116,185,255,${0.5 + 0.3 * Math.sin(time * 10)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 60, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    if (e.z <= 0) return;
    const t = ENEMY_TYPES[e.type];
    const p = proj(e.x, e.y, e.z);
    const size = t.size * p.s;
    const fog = clamp(1 - e.z / 1900, 0.3, 1);
    ctx.save();
    ctx.globalAlpha = fog;
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.PI); // el morro apunta hacia la cámara
    drawShape(size, e.flash > 0 ? '#ffffff' : t.color, '#74b9ff');
    if (e.type === 'heavy') {
      ctx.fillStyle = '#2d3436';
      for (const sx of [-0.35, 0.35]) {
        ctx.beginPath();
        ctx.arc(sx * size, size * 0.25, size * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Barra de vida sobre enemigos heridos
    if (e.hp < e.maxHp) {
      const bw = Math.max(14, size * 1.4);
      ctx.globalAlpha = fog;
      ctx.fillStyle = '#000';
      ctx.fillRect(p.x - bw / 2, p.y - size - 10, bw, 4);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(p.x - bw / 2 + 1, p.y - size - 9, Math.max(0, (bw - 2) * e.hp / e.maxHp), 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawCrosshair() {
    // La mira marca exactamente dónde impactan los disparos
    const p = proj(player.x, player.y, AIM_Z);
    ctx.strokeStyle = '#00ff9c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x - 20, p.y); ctx.lineTo(p.x - 14, p.y);
    ctx.moveTo(p.x + 14, p.y); ctx.lineTo(p.x + 20, p.y);
    ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x, p.y - 14);
    ctx.moveTo(p.x, p.y + 14); ctx.lineTo(p.x, p.y + 20);
    ctx.stroke();
    ctx.fillStyle = '#00ff9c';
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  }

  // ---------- Entorno ----------
  function drawGroundGrid() {
    const L = 1600, STEP = 40;
    ctx.strokeStyle = 'rgba(0, 180, 255, 0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < L / STEP; i++) {
      const z = (((i * STEP - scrollZ) % L) + L) % L + 20;
      const sy = HORIZON + GROUND_Y * FOCAL / (FOCAL + z);
      if (sy < H) { ctx.moveTo(0, sy); ctx.lineTo(W, sy); }
    }
    for (let k = -12; k <= 12; k++) {
      ctx.moveTo(W / 2, HORIZON);
      ctx.lineTo(W / 2 + k * 110, H);
    }
    ctx.stroke();
  }

  // ---------- Render ----------
  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    const grad = ctx.createLinearGradient(0, 0, 0, HORIZON);
    grad.addColorStop(0, '#091322');
    grad.addColorStop(1, '#1b3252');
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, HORIZON + 20);
    ctx.fillStyle = '#0b1424';
    ctx.fillRect(-20, HORIZON, W + 40, H - HORIZON + 20);
    drawGroundGrid();

    // Enemigos de lejos a cerca (así los cercanos tapan a los lejanos)
    const sorted = [...enemies].sort((a, b) => b.z - a.z);
    for (const e of sorted) drawEnemy(e);
    for (const p of pickups) drawPickup(p);
    for (const b of enemyBullets) drawEnemyBullet(b);
    for (const b of bullets) drawPlayerBullet(b);
    drawPlayer();
    if (state !== 'GAMEOVER') drawCrosshair();
    drawParticles();

    if (flashW > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashW})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    if (damageFlash > 0) {
      ctx.fillStyle = `rgba(255,0,0,${damageFlash * 0.5})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.font = "bold 14px 'Courier New'";

    // Salud
    ctx.fillStyle = '#000';
    ctx.fillRect(18, 18, 162, 14);
    ctx.fillStyle = player.hp > 50 ? '#2ecc71' : player.hp > 25 ? '#f1c40f' : '#e74c3c';
    ctx.fillRect(20, 20, 158 * player.hp / 100, 10);
    ctx.fillStyle = '#fff';
    ctx.fillText(`SALUD ${player.hp}%`, 20, 50);
    ctx.fillText(`NIVEL ${level}`, 20, 70);
    ctx.fillText(`BOMBAS ${bombs}  [B]`, 20, 90);
    ctx.fillText(`ENEMIGOS ${enemies.length + toSpawn}`, 20, 110);
    let y = 130;
    if (player.shield > 0) { ctx.fillStyle = '#74b9ff'; ctx.fillText(`ESCUDO ${player.shield.toFixed(1)}s`, 20, y); y += 20; }
    if (player.rapid > 0) { ctx.fillStyle = '#f1c40f'; ctx.fillText(`RÁPIDO ${player.rapid.toFixed(1)}s`, 20, y); }

    // Puntaje
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.fillText(`PUNTAJE ${score}`, W - 20, 30);
    ctx.fillStyle = '#88a0c0';
    ctx.fillText(`RÉCORD ${Math.max(highScore, score)}`, W - 20, 50);
    ctx.textAlign = 'left';

    // Anuncio de nivel
    if (bannerT > 0 && state === 'PLAYING') {
      ctx.globalAlpha = Math.min(1, bannerT);
      ctx.fillStyle = '#00cec9';
      ctx.font = "bold 28px 'Courier New'";
      ctx.textAlign = 'center';
      ctx.fillText(`NIVEL ${level}`, W / 2, 120);
      ctx.globalAlpha = 1;
      ctx.textAlign = 'left';
    }
  }

  function drawOverlays() {
    if (state === 'MENU') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00cec9';
      ctx.font = "bold 30px 'Courier New'";
      ctx.fillText('AIR SUPERIORITY 3D', W / 2, 150);
      ctx.fillStyle = '#fff';
      ctx.font = "14px 'Courier New'";
      ctx.fillText('Presiona ESPACIO, ENTER o haz clic para iniciar', W / 2, 200);
      ctx.fillText('WASD / flechas para volar · ESPACIO para disparar', W / 2, 225);
      ctx.fillText('B o E: bomba · P o ESC: pausa', W / 2, 250);
      ctx.fillStyle = '#88a0c0';
      ctx.fillText(`Récord: ${highScore}`, W / 2, 290);
      ctx.textAlign = 'left';
    } else if (state === 'PAUSED') {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = "bold 28px 'Courier New'";
      ctx.fillText('PAUSA', W / 2, H / 2);
      ctx.font = "14px 'Courier New'";
      ctx.fillText('Presiona P o ESC para continuar', W / 2, H / 2 + 30);
      ctx.textAlign = 'left';
    } else if (state === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff7675';
      ctx.font = "bold 30px 'Courier New'";
      ctx.fillText('GAMEOVER', W / 2, 180);
      ctx.fillStyle = '#fff';
      ctx.font = "16px 'Courier New'";
      ctx.fillText(`Puntaje: ${score} | Nivel alcanzado: ${level}`, W / 2, 230);
      ctx.fillText(`Récord: ${highScore}`, W / 2, 260);
      if (gameOverT > 1) ctx.fillText('Presiona ESPACIO para reiniciar', W / 2, 310);
      ctx.textAlign = 'left';
    }
  }

  // ---------- Actualización ----------
  function update(dt) {
    time += dt;
    player.cooldown -= dt;
    player.shield -= dt;
    player.rapid -= dt;
    player.inv -= dt;
    shake = Math.max(0, shake - dt * 30);
    flashW = Math.max(0, flashW - dt * 1.5);
    damageFlash = Math.max(0, damageFlash - dt * 2);
    bannerT = Math.max(0, bannerT - dt);
    scrollZ += 600 * dt;

    // Movimiento con suavizado y dt
    const left = keys['a'] || keys['arrowleft'];
    const right = keys['d'] || keys['arrowright'];
    const up = keys['w'] || keys['arrowup'];
    const down = keys['s'] || keys['arrowdown'];
    const ax = (right ? 1 : 0) - (left ? 1 : 0);
    const ay = (down ? 1 : 0) - (up ? 1 : 0);
    player.vx += (ax * 380 - player.vx) * Math.min(1, 8 * dt);
    player.vy += (ay * 260 - player.vy) * Math.min(1, 8 * dt);
    player.x = clamp(player.x + player.vx * dt, -LIMIT_X, LIMIT_X);
    player.y = clamp(player.y + player.vy * dt, MIN_Y, MAX_Y);
    player.bank += (ax * 22 - player.bank) * Math.min(1, 6 * dt);

    if ((keys[' '] || keys['f']) && player.cooldown <= 0) firePlayer();

    // Oleadas
    if (waveDelay > 0) {
      waveDelay -= dt;
      if (waveDelay <= 0) startWave();
    } else if (toSpawn > 0) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        toSpawn--;
        spawnTimer = rand(0.5, 0.9);
      }
    } else if (enemies.length === 0) {
      level++;
      player.hp = Math.min(100, player.hp + 25);
      bannerT = 2;
      waveDelay = 2.2;
      tone(523, 0.12, 'triangle', 0.08);
      tone(784, 0.2, 'triangle', 0.08);
    }

    for (const e of enemies) updateEnemy(e, dt);
    updatePlayerBullets(dt);
    updateEnemyBullets(dt);
    updatePickups(dt);
    updateParticles(dt);
    enemies = enemies.filter(e => e.alive);

    if (player.hp <= 0) gameOver();
  }

  // ---------- Controles ----------
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    if (audio() && actx.state === 'suspended') actx.resume();
    if (keys[k]) return; // ignora repeticiones automáticas
    keys[k] = true;

    if (state === 'MENU' && (k === ' ' || k === 'enter')) startGame();
    else if (state === 'GAMEOVER' && (k === ' ' || k === 'enter') && gameOverT > 1) startGame();
    else if (state === 'PLAYING' && (k === 'b' || k === 'e')) useBomb();
    else if (k === 'p' || k === 'escape') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  canvas.addEventListener('mousedown', () => {
    if (state === 'MENU' || (state === 'GAMEOVER' && gameOverT > 1)) startGame();
  });

  // ---------- Bucle principal ----------
  highScore = loadHigh();
  resetGame();
  state = 'MENU';

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (state === 'PLAYING') update(dt);
    if (state === 'GAMEOVER') { gameOverT += dt; updateParticles(dt); }
    render();
    drawHUD();
    drawOverlays();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
